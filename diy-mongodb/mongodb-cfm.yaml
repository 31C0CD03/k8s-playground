  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: mongodb-scripts-configmap
  data:
    init_rs.js: |
      const REPLICAS = 3;
      const MAX_VOTING = 7;
      let replicaSet = { _id: "ReplicaSet", version: 1, members: [] };
      for (let i = 0; i < REPLICAS; i++) {
        let replica = { _id: i, host: `mongodb-${i}.mongodb.default.svc.cluster.local:27017` };
        if ((i+1) > MAX_VOTING) Object.assign(replica, {priority: 0, votes: 0});
        replicaSet.members.push(replica);
      }
      rs.initiate(replicaSet);
      while (1) { try { if (rs.isMaster().primary) { break; } } catch (e) { } }
    init_user.js: |
      const adminDb = db.getSiblingDB('admin');
      adminDb.createUser({user: "root", pwd: "root", roles:[{role: "userAdminAnyDatabase" , db:"admin"}]});